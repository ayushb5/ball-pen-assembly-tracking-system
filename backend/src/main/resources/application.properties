# ==============================================================================
# Ball Pen Assembly Line Production Tracking System - Spring Boot Configuration
# ==============================================================================

# Server Port (Supports cloud dynamic $PORT with local fallback)
server.port=${PORT:8080}

# Application Name
spring.application.name=ball-pen-mes

# MySQL Database Configuration (Supports Railway MySQL variables with local fallback)
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://${MYSQLHOST:localhost}:${MYSQLPORT:3306}/${MYSQLDATABASE:ball_pen_mes_db}?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:${MYSQLUSER:root}}
spring.datasource.password=${DB_PASSWORD:${MYSQLPASSWORD:root}}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA & Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.open-in-view=false

# JWT Security Settings
# 256-bit Secret Key for HS256 algorithm
jwt.secret=404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970
# Expiration: 24 Hours (86,400,000 ms)
jwt.expiration=86400000

# Swagger / OpenAPI 3 Documentation
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operations-sorter=method
springdoc.swagger-ui.tags-sorter=alpha

# Logging Configuration
logging.level.com.ballpen.mes=INFO
logging.level.org.springframework.security=WARN
